<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Undangan Pernikahan Surya & Ella</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- FONT ELEGAN -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Great+Vibes&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      font-family:'Poppins',sans-serif;
      background:#f7f4ef;
      color:#4a3b2a;
    }
    .container{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .card{
      background:#ffffff;
      max-width:420px;
      width:100%;
      padding:45px 28px;
      text-align:center;
      border-radius:22px;
      box-shadow:0 18px 45px rgba(0,0,0,0.08);
    }

    /* Judul kecil */
    .judul{
      font-family:'Playfair Display',serif;
      font-size:16px;
      letter-spacing:3px;
      margin-bottom:18px;
      color:#7a6a55;
    }

    /* Nama pengantin BESAR & elegan */
    .nama{
      font-family:'Great Vibes',cursive;
      font-size:52px;
      margin:10px 0 20px;
      color:#8b6f47;
      line-height:1.2;
    }

    .kata{
      font-size:14px;
      line-height:1.8;
      margin:22px 0;
    }

    .tanggal{
      font-size:16px;
      margin:26px 0;
      font-weight:500;
    }

    .btn{
      display:inline-block;
      margin:12px 0;
      padding:14px 30px;
      background:#8b6f47;
      color:#fff;
      text-decoration:none;
      border-radius:30px;
      font-size:14px;
    }

    iframe{
      width:100%;
      height:220px;
      border:0;
      border-radius:14px;
      margin-top:25px;
    }

    audio{ display:none; }
  </style>
</head>

<body>

<!-- MUSIK KLASIK ROMANTIS -->
<audio autoplay loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7d1e0e0f3b.mp3" type="audio/mpeg">
</audio>

<div class="container">
  <div class="card">

    <!-- JUDUL KECIL -->
    <div class="judul">UNDANGAN PERNIKAHAN</div>

    <!-- NAMA BESAR -->
    <div class="nama">Surya &amp; Ella</div>

    <!-- KATA MANIS -->
    <div class="kata">
      “Cinta bukan tentang menemukan seseorang yang sempurna,<br>
      melainkan tentang melihat kesempurnaan<br>
      dalam ketidaksempurnaan bersama.”
    </div>

    <!-- TANGGAL -->
    <div class="tanggal">
      15 September 2017
    </div>

    <!-- RSVP -->
    <a class="btn" href="https://wa.me/6283856910542">
      Konfirmasi Kehadiran
    </a>

    <!-- GOOGLE MAPS -->
    <iframe 
  src="https://www.google.com/maps/embed?pb=https://maps.app.goo.gl/Bco3vRiph1GhGbAk6"
  loading="lazy"
  referrerpolicy="no-referrer-when-downgrade">
</iframe>

  </div>
</div>

</body>
</html>
